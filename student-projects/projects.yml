# Instructor-maintained public gallery: approved public information only.
# Keep detailed proposal reviews outside this public gallery.
- title: "From Large to Small Models: How Much Knowledge Can Be Transferred?"
  students:
    - "BEN SBEH Chaimae"
    - "CHAOU Nabila"
    - "CHAKKOUR Karima"
  description: >-
    This project investigates whether knowledge distillation can improve small
    models for banking intent classification. Using the Banking77 benchmark,
    we will transfer knowledge from large teacher models to smaller students.
    We aim to understand how student size and the amount of labeled training
    data influence the effectiveness of distillation.
  thumbnail: "images/banking-knowledge-distillation.png"
  thumbnail_alt: "Knowledge distillation illustration: a teacher model guiding a student model."
  thumbnail_credit: "https://huggingface.co/blog/Kseniase/kd"
  status: "Proposal approved"

- title: "Knowing When Not to Answer: Abstention in Retrieval-Augmented Question Answering"
  students:
    - "Youssef Ech-chahlaoui"
    - "Zouhair Fezzaz"
  description: >-
    This project investigates whether a retrieval-augmented question-answering
    system can recognize when its retrieved evidence does not support an answer.
    We will compare a standard answer-generating baseline with lightweight
    abstention strategies based on retrieval scores and answerability signals,
    using answerable and unanswerable questions. We aim to identify when these
    strategies improve reliability and when they incorrectly refuse valid
    questions.
  thumbnail: "images/rag-abstention.png"
  thumbnail_alt: >-
    Dark blue and purple infographic showing the RAG pipeline, a confidence
    check, and the two outcomes: answer with evidence or abstain.
  thumbnail_credit: "Original illustration generated for the project by the team"
  status: "Proposal approved"

- title: "Does Reranking Fix 'Lost in the Middle'? Cross-Encoder Reranking in Small-LLM RAG, in English and French"
  students:
    - "Yasmine El Alaoui"
    - "Fatima Zahrae Ahannuk"
    - "Merouane Ayach"
  description: >-
    We study whether cross-encoder reranking reduces the "Lost in the Middle"
    effect when small open-source LLMs answer questions over a niche video-game
    wiki. We compare vanilla retrieval-augmented generation with a reranked
    pipeline, vary where the key evidence sits in the prompt, and test two
    models with questions in English and French, measuring accuracy and latency.
  status: "Proposal approved"

- title: "Local Personal Data Masking Before Sharing Documents with LLMs"
  students:
    - "Konate Bachirou"
    - "Sylla Karamo"
  description: >-
    Sharing documents with external LLMs can expose personal information.
    We will build a system that processes French documents locally, detects
    personal data using fine-tuned CamemBERT, and replaces it with descriptive
    labels before sharing. Users will be able to review the masked text.
    We will evaluate detection accuracy, masking errors, and CPU performance
    to assess the system's usefulness and limitations.
  thumbnail: "images/personal-data-masking-system.png"
  thumbnail_alt: >-
    An original document passes through a local system represented by a laptop
    with a security symbol, producing a masked document with [NAME], [EMAIL],
    and [PHONE] placeholders.
  thumbnail_credit: "Original illustration by the team."
  status: "Proposal approved"
- title: "When Does Neural Memory Fail? Investigating Distractors in Multi-Hop Reasoning"
  students:
    - "Bjibji Hamza"
    - "Elbouk Abderrahimane"
  description: >-
    Can neural networks retrieve relevant information when surrounded by
    distracting facts? We propose implementing an End-to-End Memory Network
    from scratch, based on the 2015 research paper. Using the bAbI
    question-answering dataset, we will compare memory-hop configurations
    and investigate how irrelevant sentences affect performance to better
    understand attention-based memory in multi-fact reasoning.

  thumbnail: "images/multi-hop-memory-network.png"
  thumbnail_alt: >-
    Academic diagram showing external memory, relevant and distracting
    sentences, and attention-based retrieval across three memory hops.
  thumbnail_credit: "Original AI-assisted illustration by the team"
  status: "Proposal approved"

- title: "How Can We Perform Sentiment Analysis on Amazon Food Reviews?"
  students:
    - "Michel Sagesse KOLIE"
  description: >-
    This project studies sentiment in Amazon Food Reviews and explores how
    different NLP methods interpret customer opinions. We will compare VADER,
    RoBERTa, BERT-based embeddings and fine-tuning, and single- and two-layer
    LSTM models for negative, neutral and positive classification. We will also
    build a retrieval-augmented generation system to explore review evidence and
    summarize customer feedback.
  thumbnail: "images/amazon-food-reviews.png"
  thumbnail_alt: >-
    Assorted foods surrounding the words Writing for Food on Amazon.
  status: "Proposal approved"
