<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Sentiment Across Languages</title>
  <desc id="desc">A mixed Darija and French review feeds two classifiers for a controlled comparison and error analysis.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#657079" stroke-width="1.5"/></marker></defs>
  <rect width="1200" height="750" fill="#e9eee5"/>
  <g font-family="sans-serif" fill="#17212b">
    <text x="70" y="82" font-size="23" letter-spacing="4">ONE REVIEW · TWO APPROACHES</text>
    <rect x="115" y="125" width="970" height="145" rx="24" fill="#fffdf7" stroke="#cad4c6" stroke-width="2"/>
    <text x="160" y="177" font-size="22" fill="#657079">DARIJA + FRENCH</text>
    <text x="160" y="230" font-size="38">“Service zwin, mais trop cher.”</text>
    <g fill="none" stroke="#657079" stroke-width="4" marker-end="url(#arrow)">
      <path d="M450 280L450 310L310 310L310 355"/>
      <path d="M750 280L750 310L890 310L890 355"/>
      <path d="M310 495L310 535L485 535L485 575"/>
      <path d="M890 495L890 535L715 535L715 575"/>
    </g>
    <rect x="100" y="375" width="420" height="110" rx="18" fill="#244b68"/>
    <rect x="680" y="375" width="420" height="110" rx="18" fill="#426341"/>
    <g fill="#fffdf7" font-size="31" text-anchor="middle">
      <text x="310" y="439">TF–IDF baseline</text>
      <text x="890" y="423">Multilingual</text><text x="890" y="461">transformer</text>
    </g>
    <rect x="225" y="595" width="750" height="100" rx="18" fill="#fffdf7" stroke="#cad4c6" stroke-width="2"/>
    <text x="600" y="635" text-anchor="middle" font-size="27">Same split · vary normalization</text>
    <text x="600" y="674" text-anchor="middle" font-size="24" fill="#657079">Compare predictions. Read the errors.</text>
  </g>
</svg>
