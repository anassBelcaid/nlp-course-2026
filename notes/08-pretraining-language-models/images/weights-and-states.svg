<svg xmlns="http://www.w3.org/2000/svg" class="syn-weights-diagram" viewBox="0 0 1320 370" role="img" aria-label="A saved checkpoint contains learned weights. Supplying a new sentence to those weights computes new contextual states. Those states are outputs for that input, while the saved parameters can be reused again.">
<defs><marker id="sw-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f7881"/></marker></defs>
