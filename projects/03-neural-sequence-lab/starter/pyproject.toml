[project]
name = "neural-sequence-lab"
version = "0.1.0"
description = "Guided character-level sequence modeling laboratories"
requires-python = ">=3.11,<3.14"
dependencies = [
  "einops>=0.8",
  "ipykernel>=6.29",
  "jupyterlab>=4.4",
  "matplotlib>=3.10",
  "torch>=2.6",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
